[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "operatingsystembackup"
version = "0.1.0"
description = "Cross-platform CLI for incremental operating-system backups (Linux families, macOS, and Windows)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Novrus Shehaj"}]
keywords = ["backup", "rsync", "incremental", "linux-mint"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Archiving :: Backup",
]

[project.urls]
Homepage = "https://github.com/NovrusShehaj/LinuxMintBackup"
Repository = "https://github.com/NovrusShehaj/LinuxMintBackup"

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
osbackup = "operatingsystembackup.cli:main"
operatingsystembackup = "operatingsystembackup.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "gnu_rsync: tests that require a GNU rsync binary",
]
