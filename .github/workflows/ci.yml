name: CI

on:
  push:
    branches: [master, main, "dev/**"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest

  fedora-adapter-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    container: fedora:40
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and pytest
        run: dnf install -y python3 python3-pip python3-pytest
      - name: Install package
        run: python3 -m pip install -e ".[dev]"
      - name: Fedora adapter smoke
        run: python3 -m pytest tests/test_redhat.py tests/test_detect.py tests/test_platforms.py -q
